<!DOCTYPE html>
<html lang="es">
<head>

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 2rem;

    }

      color: #0b3d91;
      margin-bottom: 2rem;
    }
    .task-button {

      width: 100%;

      margin: 1rem 0;
      font-size: 1.05rem;

      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
    }
    .task-button:hover {
      background-color: #124cb3;
    }

  <div class="container">
    <h2>Ministerio del Interior</h2>
    <a href="#" class="task-button">Validar Identidad del Solicitante</a>
