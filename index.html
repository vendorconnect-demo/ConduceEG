<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Conduce EG - Portal de Trámites</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    .hero {
      background-image: url('images/banner_limpio_sin_texto.jpg');
      background-size: cover;
      background-position: center;
      padding: 120px 20px;
      text-align: center;
      color: white;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
    }
    .hero-content {
      position: relative;
      z-index: 1;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }
    .hero .cta-button {
      background-color: #0b3d91;
      color: white;
      padding: 0.9rem 2rem;
      margin: 0 10px;
      border: none;
      font-size: 1.1rem;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
    }
    .hero .cta-button:hover {
      background-color: #124cb3;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <img src="images/logo_conduce_eg.png" alt="Logo Ministerio" class="logo" />
      <h1>Conduce EG</h1>
      <a href="index-en.html" class="lang-toggle">EN</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Adelante - Conduce EG</h1>
      <p>Tu portal digital para licencias y documentación vehicular</p>
      <a href="solicitud.html" class="cta-button">Iniciar Solicitud</a>
      <a href="#" class="cta-button">Acceso Funcionarios</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Ministerio del Interior y Corporaciones Locales - República de Guinea Ecuatorial</p>
  </footer>
</body>
</html>
